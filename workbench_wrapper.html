apple-system,\"PingFang SC\",\"Helvetica Neue\",\"Microsoft YaHei\",sans-serif;\n  background:var(--bg);color:var(--text);\n  max-width:420px;margin:0 auto;min-height:100vh;\n  padding-bottom:70px;overflow-x:hidden;\n}\n/* Top Nav */\n.top-nav{\n  position:sticky;top:0;z-index:100;background:var(--bg);\n  padding:12px 16px 8px;border-bottom:1px solid var(--border);\n}\n.top-nav .date{font-size:15px;font-weight:600;color:var(--text)}\n.top-nav .greeting{font-size:13px;color:var(--text2);margin-top:2px}\n/* Bottom Tab */\n.tab-bar{\n  position:fixed;bottom:0;left:50%;transform:translateX(-50%);\n  width:100%;max-width:420px;background:var(--card);\n  border-top:1px solid var(--border);display:flex;z-index:100;\n  padding:6px 0 env(safe-area-inset-bottom,8px);\n}\n.tab-item{\n  flex:1;display:flex;flex-direction:column;align-items:center;\n  padding:8px 0;cursor:pointer;transition:all .3s ease;\n  min-height:44px;border:none;background:none;color:var(--text3);\n  font-size:11px;font-family:inherit;\n}\n.tab-item.active{color:var(--green)}\n.tab-item .tab-icon{font-size:22px;margin-bottom:2px}\n/* Pages */\n.page{display:none;padding:12px 14px;animation:fadeIn .3s ease}\n.page.active{display:block}\n@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n/* Cards */\n.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}\n.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}\n/* Progress */\n.progress-wrap{margin-bottom:16px}\n.progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}\n.progress-bar-fill{height:100%;background:var(--green-grad);border-radius:4px;transition:width .5s ease}\n.progress-text{font-size:13px;color:var(--text2);margin-top:6px;text-align:right}\n/* Task Group */\n.task-group{margin-bottom:8px}\n.group-header{font-size:13px;font-weight:600;color:var(--text2);padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;align-items:center;gap:6px}\n/* Task Item */\n.task-item{\n  display:flex;align-items:center;padding:10px 4px;gap:10px;\n  border-bottom:1px solid transparent;transition:all .3s ease;\n  min-height:44px;cursor:pointer;border-radius:8px;\n}\n.task-item:active{background:var(--green-light)}\n.task-item.done .task-title{color:var(--text3);text-decoration:line-through}\n.task-item.done .task-time{color:var(--text3);text-decoration:line-through}\n.task-emoji{font-size:20px;flex-shrink:0;width:28px;text-align:center}\n.task-info{flex:1;min-width:0}\n.task-title{font-size:14px;font-weight:500;transition:all .3s}\n.task-sub{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.task-time{font-size:12px;color:var(--text2);flex-shrink:0}\n.task-check{\n  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);\n  flex-shrink:0;display:flex;align-items:center;justify-content:center;\n  transition:all .3s ease;font-size:14px;color:transparent;\n}\n.task-item.done .task-check{background:var(--green);border-color:var(--green);color:#fff}\n/* Celebration */\n.celebration{\n  display:none;text-align:center;padding:20px;\n  animation:bounceIn .6s ease;\n}\n.celebration.show{display:block}\n.celebration .emoji{font-size:48px}\n.celebration .msg{font-size:16px;font-weight:600;color:var(--green);margin-top:8px}\n@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.05)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}\n/* Confetti */\n.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}\n.confetti{\n  position:absolute;width:8px;height:8px;border-radius:2px;\n  animation:confettiFall 2s ease-out forwards;\n}\n@keyframes confettiFall{\n  0%{transform:translateY(-20px) rotate(0deg);opacity:1}\n  100%{transform:translateY(100vh) rotate(720deg);opacity:0}\n}\n/* Creative Cards */\n.creative-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.creative-card{\n  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);\n  padding:20px 14px;text-align:center;cursor:pointer;transition:all .3s ease;\n  min-height:44px;border:none;font-family:inherit;color:var(--text);\n}\n.creative-card:active{transform:scale(0.96)}\n.creative-card .cc-icon{font-size:32px;margin-bottom:6px}\n.creative-card .cc-title{font-size:14px;font-weight:600}\n.creative-card .cc-desc{font-size:11px;color:var(--text3);margin-top:4px}\n/* Modal / Bottom Sheet */\n.modal-overlay{\n  display:none;position:fixed;top:0;left:0;width:100%;height:100%;\n  background:rgba(0,0,0,0.4);z-index:200;\n  opacity:0;transition:opacity .3s ease;\n}\n.modal-overlay.show{display:flex;align-items:flex-end;justify-content:center;opacity:1}\n.modal-sheet{\n  background:var(--bg);width:100%;max-width:420px;\n  border-radius:20px 20px 0 0;padding:20px 16px 30px;\n  max-height:85vh;overflow-y:auto;\n  transform:translateY(100%);transition:transform .3s ease;\n}\n.modal-overlay.show .modal-sheet{transform:translateY(0)}\n.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}\n.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}\n.modal-close{\n  margin-left:auto;width:28px;height:28px;border-radius:50%;\n  background:var(--border);border:none;font-size:16px;cursor:pointer;\n  display:flex;align-items:center;justify-content:center;color:var(--text2);\n  min-height:28px;font-family:inherit;\n}\n/* Form elements */\n.input-row{display:flex;gap:8px;margin-bottom:10px}\n.input-field{\n  flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;\n  font-size:14px;background:var(--card);color:var(--text);\n  min-height:44px;font-family:inherit;\n}\n.input-field:focus{outline:none;border-color:var(--green)}\ntextarea.input-field{resize:vertical;min-height:80px}\n.btn{\n  padding:10px 16px;border-radius:8px;border:none;font-size:14px;\n  font-weight:600;cursor:pointer;transition:all .2s;\n  min-height:44px;font-family:inherit;\n}\n.btn-primary{background:var(--green);color:#fff}\n.btn-primary:active{background:#388E3C}\n.btn-sm{padding:6px 12px;font-size:12px;min-height:32px}\n.btn-danger{background:#EF5350;color:#fff}\n.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}\n/* List items */\n.list-item{\n  display:flex;align-items:center;padding:10px 12px;\n  background:var(--card);border-radius:8px;margin-bottom:6px;\n  gap:8px;min-height:44px;box-shadow:0 1px 4px rgba(0,0,0,0.04);\n}\n.list-item-text{flex:1;font-size:14px}\n.list-item-sub{font-size:11px;color:var(--text3)}\n.delete-btn{\n  width:28px;height:28px;border-radius:50%;border:none;\n  background:#FFEBEE;color:#EF5350;font-size:14px;cursor:pointer;\n  display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;min-height:28px;\n}\n/* Status badges */\n.status-badge{\n  padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;\n  cursor:pointer;min-height:28px;border:none;font-family:inherit;\n  transition:all .2s;\n}\n.status-0{background:#EEEEEE;color:#999}\n.status-1{background:var(--blue-light);color:var(--blue)}\n.status-2{background:var(--orange-light);color:var(--orange)}\n.status-3{background:#F3E8FF;color:#7C3AED}\n.status-4{background:#E0F2FE;color:#0284C7}\n.status-5{background:var(--green-light);color:var(--green)}\n/* Calendar */\n.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}\n.cal-header{font-size:11px;color:var(--text3);padding:4px 0;font-weight:600}\n.cal-day{\n  font-size:13px;padding:6px 2px;border-radius:8px;cursor:pointer;\n  min-height:36px;display:flex;flex-direction:column;align-items:center;\n  justify-content:center;transition:all .2s;position:relative;\n}\n.cal-day.empty{cursor:default}\n.cal-day.today{border:2px solid var(--green)}\n.cal-day.checked{background:var(--green-light)}\n.cal-day .check-mark{font-size:10px;color:var(--green);font-weight:700}\n.cal-day .exercise-icon{font-size:8px;color:var(--text3)}\n.cal-stats{font-size:13px;color:var(--text2);margin-top:10px;text-align:center}\n/* Meal section */\n.meal-section{margin-bottom:12px}\n.meal-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:4px}\n.meal-item{\n  display:flex;align-items:center;padding:8px 10px;\n  background:var(--card);border-radius:8px;margin-bottom:4px;\n  gap:6px;font-size:13px;\n}\n.meal-item-text{flex:1}\n/* Tab sections */\n.section-title{font-size:15px;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:6px}\n/* Placeholder */\n.placeholder{text-align:center;padding:30px;color:var(--text3);font-size:14px}\n/* Scrollbar */\n::-webkit-scrollbar{width:0;height:0}\n/* Life tab full-width card */\n.life-full{grid-template-columns:1fr}\n</style>\n</head>\n<body>\n\n<!-- Top Navigation -->\n<div class=\"top-nav\">\n  <div class=\"date\" id=\"topDate\"></div>\n  <div class=\"greeting\" id=\"topGreeting\"></div>\n</div>\n\n<!-- Page 1: Daily Plan -->\n<div class=\"page active\" id=\"page-plan\">\n  <div class=\"progress-wrap\">\n    <div class=\"progress-bar-bg\"><div class=\"progress-bar-fill\" id=\"progressFill\" style=\"width:0%\"></div></div>\n    <div class=\"progress-text\" id=\"progressText\">0/20</div>\n  </div>\n  <div class=\"celebration\" id=\"celebration\">\n    <div class=\"emoji\">\ud83c\udf89</div>\n    <div class=\"msg\">\u4eca\u5929\u4e5f\u8f9b\u82e6\u4e86\uff01</div>\n  </div>\n  <div id=\"taskContainer\"></div>\n</div>\n\n<!-- Page 2: Creative Workspace -->\n<div class=\"page\" id=\"page-creative\">\n  <div class=\"creative-grid\">\n    <button class=\"creative-card\" onclick=\"openModal('ideas')\">\n      <div class=\"cc-icon\">\ud83d\udca1</div>\n      <div class=\"cc-title\">\u9009\u9898\u7075\u611f</div>\n      <div class=\"cc-desc\">\u8bb0\u5f55\u4f60\u7684\u7075\u611f</div>\n    </button>\n    <button class=\"creative-card\" onclick=\"openModal('orders')\">\n      <div class=\"cc-icon\">\ud83d\udccb</div>\n      <div class=\"cc-title\">\u5546\u5355\u8fdb\u5ea6</div>\n      <div class=\"cc-desc\">\u7ba1\u7406\u5408\u4f5c\u8fdb\u5ea6</div>\n    </button>\n    <button class=\"creative-card\" onclick=\"openModal('review')\">\n      <div class=\"cc-icon\">\ud83d\udcca</div>\n      <div class=\"cc-title\">\u5185\u5bb9\u590d\u76d8</div>\n      <div class=\"cc-desc\">\u6570\u636e\u8ffd\u8e2a\u5206\u6790</div>\n    </button>\n    <button class=\"creative-card\" onclick=\"openModal('hot')\">\n      <div class=\"cc-icon\">\ud83d\udd25</div>\n      <div class=\"cc-title\">\u7206\u6b3e\u70ed\u70b9</div>\n      <div class=\"cc-desc\">\u8ffd\u8e2a\u70ed\u95e8\u8d8b\u52bf</div>\n    </button>\n    <button class=\"creative-card\" onclick=\"openModal('memo')\" style=\"grid-column:span 2\">\n      <div class=\"cc-icon\">\ud83d\udcdd</div>\n      <div class=\"cc-title\">\u5907\u5fd8\u5f55</div>\n      <div class=\"cc-desc\">\u968f\u624b\u8bb0\u5f55\u5f85\u529e\u4e8b\u9879</div>\n    </button>\n  </div>\n</div>\n\n<!-- Page 3: Life -->\n<div class=\"page\" id=\"page-life\">\n  <div class=\"section-title\">\ud83d\udc76 \u4e03\u4e03\u8bb0\u5f55</div>\n  <div class=\"card\" id=\"qiqiCard\">\n    <div class=\"input-row\">\n      <input class=\"input-field\" id=\"qiqiInput\" placeholder=\"\u8bb0\u5f55\u4e03\u4e03\u7684\u6210\u957f\u77ac\u95f4...\">\n      <button class=\"btn btn-primary btn-sm\" onclick=\"addQiqi()\">\u6dfb\u52a0</button>\n    </div>\n    <div id=\"qiqiList\"></div>\n  </div>\n  <div class=\"section-title\">\ud83c\udfc3\u200d\u2640\ufe0f \u8fd0\u52a8\u6253\u5361</div>\n  <div class=\"card\">\n    <div id=\"calendarContainer\"></div>\n    <div class=\"cal-stats\" id=\"calStats\"></div>\n  </div>\n  <div class=\"section-title\">\ud83c\udf7d\ufe0f \u996e\u98df\u8bb0\u5f55</div>\n  <div class=\"card\" id=\"dietCard\"></div>\n</div>\n\n<!-- Bottom Tab Bar -->\n<div class=\"tab-bar\">\n  <button class=\"tab-item active\" onclick=\"switchTab(0)\">\n    <span class=\"tab-icon\">\ud83d\udccb</span>\u6bcf\u65e5\u8ba1\u5212\n  </button>\n  <button class=\"tab-item\" onclick=\"switchTab(1)\">\n    <span class=\"tab-icon\">\ud83c\udfa8</span>\u521b\u4f5c\u5de5\u4f5c\u53f0\n  </button>\n  <button class=\"tab-item\" onclick=\"switchTab(2)\">\n    <span class=\"tab-icon\">\ud83c\udfe0</span>\u751f\u6d3b\n  </button>\n</div>\n\n<!-- Modals -->\n<div class=\"modal-overlay\" id=\"modalOverlay\" onclick=\"closeModalOverlay(event)\">\n  <div class=\"modal-sheet\" id=\"modalSheet\">\n    <div class=\"modal-handle\"></div>\n    <div class=\"modal-title\"><span id=\"modalTitleText\"></span><button class=\"modal-close\" onclick=\"closeModal()\">\u2715</button></div>\n    <div id=\"modalBody\"></div>\n  </div>\n</div>\n\n<!-- Confetti Container -->\n<div class=\"confetti-container\" id=\"confettiContainer\"></div>\n\n<script>\n// ======================== UTILS ========================\nconst $=id=>document.getElementById(id);\nconst LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};\nconst today=()=>new Date().toISOString().slice(0,10);\nconst dayNames=['\u65e5','\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d'];\n\n// ======================== TOP NAV ========================\nfunction updateTopNav(){\n  const now=new Date();\n  const m=now.getMonth()+1, d=now.getDate(), w=dayNames[now.getDay()];\n  $('topDate').textContent=`${m}\u6708${d}\u65e5 \u661f\u671f${w}`;\n  const h=now.getHours();\n  let g='\u591c\u6df1\u4e86 \ud83c\udf19';\n  if(h>=5&&h<=11)g='\u65e9\u4e0a\u597d \u2600\ufe0f';\n  else if(h>=12&&h<=17)g='\u4e0b\u5348\u597d \ud83c\udf24';\n  else if(h>=18&&h<=22)g='\u665a\u4e0a\u597d \ud83c\udf06';\n  $('topGreeting').textContent=g;\n}\nupdateTopNav();\nsetInterval(updateTopNav,60000);\n\n// ======================== TAB SWITCH ========================\nfunction switchTab(idx){\n  document.querySelectorAll('.tab-item').forEach((t,i)=>{t.classList.toggle('active',i===idx)});\n  document.querySelectorAll('.page').forEach((p,i)=>{p.classList.toggle('active',i===idx)});\n  if(idx===2)renderLife();\n}\n\n// ======================== DAILY PLAN ========================\nfunction getTasks(){\n  const dow=new Date().getDay();// 0=Sun\n  const isCore=[1,3,6].includes(dow);// Mon,Wed,Sat\n  const exerciseSub=isCore?'\u6838\u5fc3\u8ddf\u7ec3+\u4f53\u6001\u8bad\u7ec3+3000\u6b65\u5927\u6b65\u8d70':'\u9a91\u8f6630\u5206\u949f';\n  return [\n    {group:'\ud83c\udf05 \u65e9\u6668',emoji:'\u2600\ufe0f',title:'\u8d77\u5e8a + \u559d\u6e29\u6c34',time:'7:30'},\n    {emoji:'\ud83e\udd63',title:'\u65e9\u9910',time:'8:00',sub:'\u9e21\u86cb2\u4e2a+\u86cb\u767d1\u4e2a+\u725b\u6cb9\u679c\u534a\u4e2a+\u84dd\u8393100g+\u6838\u68432\u4e2a'},\n    {emoji:'\ud83e\uddf8',title:'\u966a\u4e03\u4e03\u73a9 / \u6237\u5916\u6563\u6b65',time:'8:30'},\n    {group:'\ud83c\udfcb\ufe0f \u8fd0\u52a8',emoji:'\ud83d\udcaa',title:'\u8fd0\u52a8\u65f6\u95f4',time:'9:00',sub:exerciseSub},\n    {group:'\ud83e\uddf4 \u4e0a\u5348\u5de5\u4f5c',emoji:'\ud83e\uddf4',title:'\u62a4\u80a4 + \u6536\u62fe\u81ea\u5df1',time:'10:00'},\n    {emoji:'\ud83d\udcca',title:'\u67e5\u770b\u6628\u65e5\u6570\u636e + \u56de\u590d\u8bc4\u8bba',time:'10:30'},\n    {group:'\ud83c\udf71 \u5348\u9910',emoji:'\ud83c\udf73',title:'\u51c6\u5907\u5348\u9910',time:'11:30',sub:'\u6742\u7cae\u996d/\u571f\u8c46150g + \u9c7c\u8089/\u9e21\u8089150g + \u7092\u83dc300g'},\n    {emoji:'\ud83c\udf5a',title:'\u548c\u4e03\u4e03\u4e00\u8d77\u5403\u5348\u996d',time:'12:00'},\n    {group:'\ud83d\udcbc \u9ec4\u91d1\u5de5\u4f5c\u671f',emoji:'\u270d\ufe0f',title:'\u5199\u6587\u6848 / \u4fee\u56fe / \u6392\u7248',time:'12:30'},\n    {emoji:'\ud83d\udcf8',title:'\u6df1\u5ea6\u5de5\u4f5c\uff08\u5927\u7eb2/\u9009\u9898/\u62cd\u6444\uff09',time:'13:30'},\n    {emoji:'\ud83d\udcc1',title:'\u6574\u7406\u4eca\u65e5\u4ea7\u51fa + \u5f52\u6863',time:'14:30'},\n    {group:'\u2615 \u4e0b\u5348',emoji:'\ud83c\udfa8',title:'\u966a\u4e03\u4e03\uff08\u5348\u7761\u9192\u6765\uff09',time:'15:00'},\n    {emoji:'\ud83d\udcac',title:'\u5546\u52a1\u6c9f\u901a / \u54c1\u724c\u5bf9\u63a5',time:'16:00'},\n    {emoji:'\ud83d\udce6',title:'\u62cd\u4ea7\u54c1\u7d20\u6750 / \u6574\u7406\u4ea7\u54c1\u5e93',time:'17:00'},\n    {group:'\ud83c\udf72 \u665a\u9910',emoji:'\ud83e\udd57',title:'\u51c6\u5907\u665a\u9910',time:'18:00',sub:'\u6742\u7cae\u996d/\u571f\u8c46150g + \u725b\u8089/\u7626\u8089150g + \u7092\u83dc250g + \u59dc\u849c\u756a\u8304'},\n    {group:'\ud83d\udec1 \u4eb2\u5b50\u65f6\u95f4',emoji:'\ud83d\udec1',title:'\u7ed9\u4e03\u4e03\u6d17\u6fa1 / \u54c4\u7761',time:'19:00'},\n    {group:'\ud83c\udf19 \u665a\u95f4',emoji:'\ud83d\udcac',title:'\u56de\u8bc4\u8bba + \u770b\u6570\u636e + \u60f3\u9009\u9898',time:'21:00'},\n    {emoji:'\ud83d\udcdd',title:'\u6574\u7406\u660e\u65e5\u5f85\u529e\u6e05\u5355',time:'22:00'},\n    {group:'\ud83d\udecf\ufe0f \u6536\u5de5',emoji:'\ud83e\uddf4',title:'\u62a4\u80a4\u6d17\u6f31',time:'22:30'},\n    {emoji:'\ud83d\udca4',title:'\u4e0a\u5e8a\u7761\u89c9\uff08\u6700\u665a23:30\uff09',time:'23:00'},\n  ];\n}\nconst TOTAL_TASKS=20;\nlet planState=LS.get('plan_'+today(),{done:[]});\n\nfunction checkDayReset(){\n  const key='plan_'+today();\n  if(!localStorage.getItem(key)){planState={done:[]};LS.set(key,planState)}\n}\ncheckDayReset();\n\n// \u5546\u5355\u8fdc\u7a0b\u6570\u636e\u540c\u6b65\nconst ORDERS_REMOTE_URL='https://www.coze.cn/s/zEQOAJBuEE0/';\nconst ORDERS_FALLBACK=[\n  {name:'Valcena\u6297\u7cd6\u524d\u4f53\u80f6\u56ca',brand:'Valcena',date:'',note:'\u5df2\u5b8c\u6210\u4ea4\u4ed8',status:5,account:'\u5b9d\u73e0'},\n  {name:'\u8212\u8299\u857e\u6155\u65af',brand:'',date:'',note:'\u5df2\u5b8c\u6210\u4ea4\u4ed8',status:5,account:'\u5b9d\u73e0'},\n  {name:'\u6d77\u84dd\u4e4b\u8c1c\u7cbe\u7cb9\u6c34\u4e73',brand:'\u6d77\u84dd\u4e4b\u8c1c',date:'',note:'\u5df2\u5b8c\u6210\u4ea4\u4ed8',status:5,account:'\u5b9d\u73e0'},\n  {name:'\u8d6b\u83b2\u5a1c\uff08\u9ed1\u7ef7\u5e26+\u7eff\u5b9d\u74f6\uff09',brand:'\u8d6b\u83b2\u5a1c',date:'',note:'\u5df2\u62cd\u5b8c',status:5,account:'\u571f\u8c46'},\n  {name:'\u96c5\u8bd7\u5170\u9edb\u590d\u6d3b\u6c34',brand:'\u96c5\u8bd7\u5170\u9edb',date:'2026-07-06',note:'\u5df2\u53d1\u5e03',status:5,account:'\u571f\u8c46'},\n  {name:'\u888b\u9f20\u5988\u5988',brand:'\u888b\u9f20\u5988\u5988',date:'2026-07-17',note:'\u903e\u671f\u5b8c\u6210',status:5,account:'\u571f\u8c46'},\n  {name:'\u5965\u5999',brand:'\u5965\u5999',date:'2026-07-17',note:'\u63d0\u524d\u5b8c\u6210\uff0c\u6863\u671f7/25',status:5,account:'\u5b9d\u73e0'},\n  {name:'\u4f0a\u83f2\u4e39\u8d85\u7ea7\u9762\u819c',brand:'\u4f0a\u83f2\u4e39',date:'',note:'\u5df2\u5b8c\u6210',status:5,account:'\u571f\u8c46'},\n  {name:'\u8587\u8bfa\u5a1c\u4e03\u5915\u793c\u76d2',brand:'\u8587\u8bfa\u5a1c',date:'2026-07-21',note:'\u5927\u7eb2\u5df2\u63d0\u4ea4\u5f85\u62cd\u6444\uff0c\u6392\u7ade15\u5929',status:1,account:'\u571f\u8c46'},\n  {name:'\u96c5\u8bd7\u5170\u9edb\u9ed1\u795e\u8bdd\u9762\u971c',brand:'\u96c5\u8bd7\u5170\u9edb',date:'2026-07-23',note:'\u521d\u7a3f7/23\uff0c\u53d1\u5e037/25',status:3,account:'\u571f\u8c46'},\n  {name:'\u5170\u853b\u83c1\u7eaf',brand:'\u5170\u853b',date:'',note:'\u5927\u7eb2\u5df2\u63d0\u4ea4\u5f85\u62cd\u6444\uff0c\u6863\u671f7-8\u6708',status:1,account:'\u5b9d\u73e0'},\n  {name:'\u989c\u829d\u8ff7\u7cbe\u534e',brand:'\u989c\u829d\u8ff7',date:'2026-07-25',note:'\u5927\u7eb2\u5df2\u63d0\u4ea4\u5f85\u62cd\u6444\uff0c\u9700\u8865\u62cd\u8d28\u5730\u6447\u6643\u5bf9\u6bd4\u56fe',status:1,account:'\u5b9d\u73e0'},\n  {name:'\u677e\u4e0b\u5243\u987b\u5200',brand:'\u677e\u4e0b',date:'2026-07-15',note:'\u903e\u671f\uff0c\u539f\u6863\u671f7/15',status:0,account:'\u571f\u8c46'},\n  {name:'\u9002\u4e50\u80a4\u6c34\u6768\u9178\u6d01\u9762+PM\u4e73',brand:'\u9002\u4e50\u80a4',date:'2026-07-22',note:'\u521d\u7a3f7/22\uff0c\u53d1\u5e037/23\uff0c\u9700\u81ea\u8d2d\u540e\u62a5\u9500',status:4,account:'\u571f\u8c46'},\n  {name:'AMIRO\u89c5\u5149X\u955c',brand:'AMIRO\u89c5\u5149',date:'2026-08-01',note:'\u6863\u671f8/1-2\uff0c\u8fd4\u70b925%\uff0c\u62a5\u4ef73000\uff0c\u5bc4\u62cd',status:0,account:'\u571f\u8c46'},\n  {name:'\u5965\u5999',brand:'\u5965\u5999',date:'2026-07-23',note:'\u516c\u53f8\u63a5\u7684\uff0c\u4eca\u5929\u62cd\u6444',status:2,account:'\u571f\u8c46'},\n];\n// \u65e7\u6570\u636e\u8fc1\u79fb\uff1a4\u72b6\u6001\u21926\u72b6\u6001 + \u8d26\u53f7\u5b57\u6bb5\nfunction migrateOrders(orders){\n  const baobaoBrands=['Valcena','\u8212\u8299\u857e','\u6d77\u84dd\u4e4b\u8c1c','\u5965\u5999','\u5170\u853b','\u989c\u829d\u8ff7'];\n  let migrated=false;\n  orders.forEach(o=>{\n    if(!o._v4){\n      if(o.status===3&&o.note&&o.note.includes('\u5b8c\u6210')){o.status=5;migrated=true}\n      o._v4=true;migrated=true;\n    }\n    if(!o.account){\n      const match=baobaoBrands.some(b=>(o.name||'').includes(b)||(o.brand||'').includes(b));\n      o.account=match?'\u5b9d\u73e0':'\u571f\u8c46';migrated=true;\n    }\n  });\n  return migrated;\n}\n// \u521d\u59cb\u5316\uff1a\u5148\u7528\u672c\u5730\u6570\u636e\uff0c\u518d\u5c1d\u8bd5\u4ece\u8fdc\u7a0b\u540c\u6b65\nif(!localStorage.getItem('orders')){\n  LS.set('orders',ORDERS_FALLBACK);\n  migrateOrders(LS.get('orders',[]));\n  LS.set('orders',LS.get('orders',[]));\n}\n// \u8fdc\u7a0b\u540c\u6b65\uff1a\u6bcf\u6b21\u6253\u5f00\u9875\u9762\u65f6\u5c1d\u8bd5\u4ece\u8fdc\u7a0b\u62c9\u53d6\u6700\u65b0\u5546\u5355\u6570\u636e\n(async function syncOrdersFromRemote(){\n  try{\n    const resp=await fetch(ORDERS_REMOTE_URL,{cache:'no-store'});\n    if(!resp.ok)return;\n    const text=await resp.text();\n    // \u5c1d\u8bd5\u89e3\u6790\u4e3aJSON\u6570\u7ec4\n    let data;\n    try{data=JSON.parse(text)}catch(e){\n      // \u53ef\u80fd\u8fd4\u56de\u7684\u662fHTML\u5305\u88c5\u9875\u9762\uff0c\u5c1d\u8bd5\u63d0\u53d6JSON\n      const m=text.match(/\\[[\\s\\S]*\\]/);\n      if(m)data=JSON.parse(m[0]);else return;\n    }\n    if(!Array.isArray(data)||data.length===0)return;\n    // \u8fc1\u79fb\u5904\u7406\n    migrateOrders(data);\n    // \u5bf9\u6bd4\uff1a\u5982\u679c\u8fdc\u7a0b\u6570\u636e\u548c\u672c\u5730\u6570\u636e\u6709\u5dee\u5f02\uff0c\u4ee5\u8fdc\u7a0b\u4e3a\u51c6\n    const local=LS.get('orders',[]);\n    const remoteKey=JSON.stringify(data.map(o=>o.name+'|'+o.status+'|'+o.note).sort());\n    const localKey=JSON.stringify(local.map(o=>o.name+'|'+o.status+'|'+o.note).sort());\n    if(remoteKey!==localKey){\n      // \u5982\u679c\u7528\u6237\u5728\u672c\u8bbe\u5907\u624b\u52a8\u6539\u8fc7\u72b6\u6001\uff0c\u4e0d\u4ee5\u8fdc\u7a0b\u8986\u76d6\n      if(localStorage.getItem('ordersLocalChanged')==='1')return;\n      LS.set('orders',data);\n      // \u5982\u679c\u5546\u5355\u9875\u9762\u6b63\u5728\u663e\u793a\uff0c\u5237\u65b0\u5217\u8868\n      if($('orderList'))renderOrderList();\n    }\n  }catch(e){/* \u7f51\u7edc\u5f02\u5e38\u65f6\u4f7f\u7528\u672c\u5730\u6570\u636e\uff0c\u9759\u9ed8\u5904\u7406 */}\n})();\n\nfunction renderTasks(){\n  const tasks=getTasks();\n  const container=$('taskContainer');\n  container.innerHTML='';\n  let lastGroup='';\n  tasks.forEach((t,i)=>{\n    if(t.group&&t.group!==lastGroup){\n      lastGroup=t.group;\n      const gh=document.createElement('div');\n      gh.className='group-header';\n      gh.textContent=t.group;\n      container.appendChild(gh);\n    }\n    const div=document.createElement('div');\n    div.className='task-item'+(planState.done.includes(i)?' done':'');\n    div.onclick=()=>toggleTask(i);\n    div.innerHTML=`\n      <span class=\"task-emoji\">${t.emoji}</span>\n      <div class=\"task-info\">\n        <div class=\"task-title\">${t.title}</div>\n        ${t.sub?'<div class=\"task-sub\">'+t.sub+'</div>':''}\n      </div>\n      <span class=\"task-time\">${t.time}</span>\n      <span class=\"task-check\">${planState.done.includes(i)?'\u2713':''}</span>\n    `;\n    container.appendChild(div);\n  });\n  updateProgress();\n}\n\nfunction toggleTask(i){\n  const key='plan_'+today();\n  const idx=planState.done.indexOf(i);\n  if(idx>-1)planState.done.splice(idx,1);\n  else planState.done.push(i);\n  LS.set(key,planState);\n  renderTasks();\n  if(planState.done.length===TOTAL_TASKS)showCelebration();\n}\n\nfunction updateProgress(){\n  const n=planState.done.length;\n  $('progressFill').style.width=(n/TOTAL_TASKS*100)+'%';\n  $('progressText').textContent=n+'/'+TOTAL_TASKS;\n}\n\nfunction showCelebration(){\n  $('celebration').classList.add('show');\n  launchConfetti();\n}\nfunction launchConfetti(){\n  const c=$('confettiContainer');c.innerHTML='';\n  const colors=['#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#FF8B94','#6C5CE7','#FDCB6E'];\n  for(let i=0;i<60;i++){\n    const d=document.createElement('div');d.className='confetti';\n    d.style.left=Math.random()*100+'%';\n    d.style.background=colors[Math.floor(Math.random()*colors.length)];\n    d.style.animationDelay=Math.random()*0.8+'s';\n    d.style.animationDuration=(1.5+Math.random())+'s';\n    d.style.width=(6+Math.random()*6)+'px';\n    d.style.height=(6+Math.random()*6)+'px';\n    c.appendChild(d);\n  }\n  setTimeout(()=>c.innerHTML='',3000);\n}\nif(planState.done.length===TOTAL_TASKS)showCelebration();\nrenderTasks();\n\n// ======================== MODALS ========================\nfunction openModal(type){\n  const overlay=$('modalOverlay');\n  const title=$('modalTitleText');\n  const body=$('modalBody');\n  overlay.style.display='flex';\n  requestAnimationFrame(()=>overlay.classList.add('show'));\n  switch(type){\n    case 'ideas':renderIdeas(title,body);break;\n    case 'orders':renderOrders(title,body);break;\n    case 'review':renderReview(title,body);break;\n    case 'hot':renderHot(title,body);break;\n    case 'memo':renderMemo(title,body);break;\n  }\n}\nfunction closeModal(){\n  const overlay=$('modalOverlay');\n  overlay.classList.remove('show');\n  setTimeout(()=>overlay.style.display='none',300);\n}\nfunction closeModalOverlay(e){if(e.target===$('modalOverlay'))closeModal()}\n\n// --- Ideas ---\nfunction renderIdeas(title,body){\n  title.textContent='\ud83d\udca1 \u9009\u9898\u7075\u611f';\n  const ideas=LS.get('ideas',[]);\n  body.innerHTML=`\n    <div class=\"input-row\">\n      <input class=\"input-field\" id=\"ideaInput\" placeholder=\"\u8f93\u5165\u7075\u611f...\">\n      <button class=\"btn btn-primary btn-sm\" onclick=\"addIdea()\">\u6dfb\u52a0</button>\n    </div>\n    <div id=\"ideaList\"></div>\n  `;\n  renderIdeaList();\n  $('ideaInput').addEventListener('keydown',e=>{if(e.key==='Enter')addIdea()});\n}\nfunction addIdea(){\n  const inp=$('ideaInput');const v=inp.value.trim();if(!v)return;\n  const ideas=LS.get('ideas',[]);\n  ideas.unshift({text:v,time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});\n  LS.set('ideas',ideas);inp.value='';renderIdeaList();\n}\nfunction renderIdeaList(){\n  const ideas=LS.get('ideas',[]);\n  const list=$('ideaList');\n  list.innerHTML=ideas.map((it,i)=>`\n    <div class=\"list-item\">\n      <div class=\"list-item-text\">${esc(it.text)}<div class=\"list-item-sub\">${it.time}</div></div>\n      <button class=\"delete-btn\" onclick=\"delIdea(${i})\">\u00d7</button>\n    </div>\n  `).join('');\n}\nfunction delIdea(i){const a=LS.get('ideas',[]);a.splice(i,1);LS.set('ideas',a);renderIdeaList()}\n\n// --- Orders ---\nfunction renderOrders(title,body){\n  title.textContent='\ud83d\udccb \u5546\u5355\u8fdb\u5ea6';\n  body.innerHTML=`\n    <div style=\"text-align:center;padding:8px 0;margin-bottom:10px;font-size:12px;color:var(--text3)\">\u5546\u5355\u7531\u5c0f\u85af\u7edf\u4e00\u7ba1\u7406\uff0c\u6709\u65b0\u9879\u76ee\u76f4\u63a5\u544a\u8bc9\u5979\u5373\u53ef \u2728</div>\n    <div id=\"orderList\"></div>\n  `;\n  renderOrderList();\n}\n\nfunction renderOrderList(){\n  const orders=LS.get('orders',[]);\n  const statusNames=['\u5f85\u5199\u5927\u7eb2','\u5927\u7eb2\u5df2\u5b8c\u6210','\u62cd\u6444\u4e2d','\u521d\u7a3f\u4e2d','\u521d\u7a3f\u5df2\u63d0\u4ea4','\u5df2\u5b8c\u6210'];\n  const statusColors=['#bbb','#4a90d9','#f5a623','#9b59b6','#4ecdc4','#27ae60'];\n  // \u6309\u72b6\u6001\u5206\u7ec4\uff0c\u540c\u72b6\u6001\u5185\u6309\u65e5\u671f\u6392\u5e8f\n  orders.sort((a,b)=>{\n    if(a.status!==b.status)return a.status-b.status;\n    return(a.date||'z').localeCompare(b.date||'z');\n  });\n  LS.set('orders',orders);\n  let html='';\n  let lastStatus=-1;\n  orders.forEach((o,i)=>{\n    if(o.status!==lastStatus){\n      html+=`<div style=\"font-size:11px;font-weight:600;color:${statusColors[o.status]};padding:8px 0 4px;border-bottom:1px solid ${statusColors[o.status]}33;margin-bottom:4px\">${statusNames[o.status]}</div>`;\n      lastStatus=o.status;\n    }\n    html+=`\n    <div class=\"list-item\" style=\"flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:0\">\n        <div class=\"list-item-text\" style=\"font-weight:600\">${esc(o.name)} <span style=\"font-size:10px;padding:1px 5px;border-radius:3px;background:${o.account==='\u5b9d\u73e0'?'#ff6b9d':'#4ecdc4'};color:#fff;margin-left:4px;vertical-align:middle\">${o.account||'\u571f\u8c46'}</span></div>\n        <div class=\"list-item-sub\">${o.brand?esc(o.brand)+' \u00b7 ':''}${o.date||'\u65e0\u622a\u6b62\u65e5'}${o.note?' \u00b7 '+esc(o.note):''}</div>\n      </div>\n      <button class=\"status-badge status-${o.status}\" onclick=\"cycleOrderStatus(${i})\">${statusNames[o.status]}</button>\n      <button class=\"delete-btn\" onclick=\"delOrder(${i})\">\u00d7</button>\n    </div>`;\n  });\n  if(!orders.length)html='<div class=\"placeholder\">\u6682\u65e0\u5546\u5355</div>';\n  $('orderList').innerHTML=html;\n}\nfunction cycleOrderStatus(i){\n  const orders=LS.get('orders',[]);\n  orders[i].status=(orders[i].status+1)%6;\n  LS.set('orders',orders);\n  localStorage.setItem('ordersLocalChanged','1');\n  renderOrderList();\n}\nfunction delOrder(i){const a=LS.get('orders',[]);a.splice(i,1);LS.set('orders',a);localStorage.setItem('ordersLocalChanged','1');renderOrderList()}\n\n// --- Review ---\nfunction renderReview(title,body){\n  title.textContent='\ud83d\udcca \u5185\u5bb9\u590d\u76d8';\n  const reviews=LS.get('reviews',[]);\n  body.innerHTML=`\n    <div style=\"margin-bottom:12px\">\n      <input class=\"input-field\" id=\"rvTitle\" placeholder=\"\u7b14\u8bb0\u6807\u9898\" style=\"margin-bottom:6px\">\n      <input class=\"input-field\" id=\"rvDate\" type=\"date\" style=\"margin-bottom:6px\">\n      <div class=\"input-row\">\n        <input class=\"input-field\" id=\"rvRead\" placeholder=\"24h\u9605\u8bfb\" type=\"number\">\n        <input class=\"input-field\" id=\"rvLike\" placeholder=\"\u70b9\u8d5e\" type=\"number\">\n      </div>\n      <div class=\"input-row\">\n        <input class=\"input-field\" id=\"rvSave\" placeholder=\"\u6536\u85cf\" type=\"number\">\n        <input class=\"input-field\" id=\"rvComment\" placeholder=\"\u8bc4\u8bba\" type=\"number\">\n      </div>\n      <textarea class=\"input-field\" id=\"rvNote\" placeholder=\"\u590d\u76d8\u7b14\u8bb0...\" style=\"margin-bottom:8px\"></textarea>\n      <button class=\"btn btn-primary\" style=\"width:100%\" onclick=\"addReview()\">\u4fdd\u5b58\u590d\u76d8</button>\n    </div>\n    <div id=\"reviewList\"></div>\n  `;\n  renderReviewList();\n}\nfunction addReview(){\n  const t=$('rvTitle').value.trim();if(!t)return;\n  const reviews=LS.get('reviews',[]);\n  reviews.push({\n    title:t,date:$('rvDate').value,read:+$('rvRead').value||0,\n    like:+$('rvLike').value||0,save:+$('rvSave').value||0,\n    comment:+$('rvComment').value||0,note:$('rvNote').value.trim()\n  });\n  LS.set('reviews',reviews);\n  $('rvTitle').value='';$('rvDate').value='';$('rvRead').value='';\n  $('rvLike').value='';$('rvSave').value='';$('rvComment').value='';$('rvNote').value='';\n  renderReviewList();\n}\nfunction renderReviewList(){\n  const reviews=LS.get('reviews',[]);\n  reviews.sort((a,b)=>(b.date||'').localeCompare(a.date||''));\n  $('reviewList').innerHTML=reviews.map((r,i)=>`\n    <div class=\"card\" style=\"margin-bottom:8px;padding:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px\">\n        <div style=\"font-weight:600;font-size:14px\">${esc(r.title)}</div>\n        <button class=\"delete-btn\" onclick=\"delReview(${i})\">\u00d7</button>\n      </div>\n      <div style=\"font-size:11px;color:var(--text3);margin-bottom:6px\">${r.date||'\u672a\u8bbe\u65e5\u671f'}</div>\n      <div style=\"display:flex;gap:12px;font-size:12px;color:var(--text2);flex-wrap:wrap\">\n        <span>\ud83d\udc41 ${r.read}</span><span>\u2764\ufe0f ${r.like}</span><span>\u2b50 ${r.save}</span><span>\ud83d\udcac ${r.comment}</span>\n      </div>\n      ${r.note?'<div style=\"font-size:12px;color:var(--text2);margin-top:6px\">'+esc(r.note)+'</div>':''}\n    </div>\n  `).join('');\n}\nfunction delReview(i){const a=LS.get('reviews',[]);a.splice(i,1);LS.set('reviews',a);renderReviewList()}\n\n// --- Hot ---\nfunction renderHot(title,body){\n  title.textContent='\ud83d\udd25 \u7206\u6b3e\u70ed\u70b9';\n  const hots=LS.get('hots',[]);\n  body.innerHTML=`\n    <div class=\"placeholder\">\ud83d\udea7 \u81ea\u52a8\u70ed\u70b9\u529f\u80fd\u5f00\u53d1\u4e2d...</div>\n    <div style=\"margin-top:12px\">\n      <div class=\"input-row\">\n        <input class=\"input-field\" id=\"hotInput\" placeholder=\"\u624b\u52a8\u6dfb\u52a0\u70ed\u70b9...\">\n        <button class=\"btn btn-primary btn-sm\" onclick=\"addHot()\">\u6dfb\u52a0</button>\n      </div>\n      <div id=\"hotList\"></div>\n    </div>\n  `;\n  renderHotList();\n  $('hotInput').addEventListener('keydown',e=>{if(e.key==='Enter')addHot()});\n}\nfunction addHot(){\n  const inp=$('hotInput');const v=inp.value.trim();if(!v)return;\n  const hots=LS.get('hots',[]);\n  hots.unshift({text:v,time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});\n  LS.set('hots',hots);inp.value='';renderHotList();\n}\nfunction renderHotList(){\n  const hots=LS.get('hots',[]);\n  $('hotList').innerHTML=hots.map((h,i)=>`\n    <div class=\"list-item\">\n      <div class=\"list-item-text\">${esc(h.text)}<div class=\"list-item-sub\">${h.time}</div></div>\n      <button class=\"delete-btn\" onclick=\"delHot(${i})\">\u00d7</button>\n    </div>\n  `).join('');\n}\nfunction delHot(i){const a=LS.get('hots',[]);a.splice(i,1);LS.set('hots',a);renderHotList()}\n\n// --- Memo ---\nfunction renderMemo(title,body){\n  title.textContent='\ud83d\udcdd \u5907\u5fd8\u5f55';\n  const memos=LS.get('memos',[]);\n  body.innerHTML=`\n    <textarea class=\"input-field\" id=\"memoInput\" placeholder=\"\u5199\u70b9\u4ec0\u4e48...\" style=\"margin-bottom:8px\"></textarea>\n    <button class=\"btn btn-primary\" style=\"width:100%;margin-bottom:12px\" onclick=\"addMemo()\">\u6dfb\u52a0\u5907\u5fd8</button>\n    <div id=\"memoList\"></div>\n  `;\n  renderMemoList();\n}\nfunction addMemo(){\n  const inp=$('memoInput');const v=inp.value.trim();if(!v)return;\n  const memos=LS.get('memos',[]);\n  memos.unshift({text:v,time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});\n  LS.set('memos',memos);inp.value='';renderMemoList();\n}\nfunction renderMemoList(){\n  const memos=LS.get('memos',[]);\n  $('memoList').innerHTML=memos.map((m,i)=>`\n    <div class=\"list-item\" style=\"align-items:flex-start\">\n      <div class=\"list-item-text\" style=\"white-space:pre-wrap\">${esc(m.text)}<div class=\"list-item-sub\">${m.time}</div></div>\n      <button class=\"delete-btn\" onclick=\"delMemo(${i})\">\u00d7</button>\n    </div>\n  `).join('');\n}\nfunction delMemo(i){const a=LS.get('memos',[]);a.splice(i,1);LS.set('memos',a);renderMemoList()}\n\n// ======================== LIFE TAB ========================\nfunction renderLife(){renderQiqi();renderCalendar();renderDiet()}\n\n// --- Qiqi ---\nfunction renderQiqi(){\n  const records=LS.get('qiqi',[]);\n  $('qiqiList').innerHTML=records.map((r,i)=>`\n    <div class=\"list-item\">\n      <span style=\"font-size:18px\">\ud83c\udf7c</span>\n      <div class=\"list-item-text\">${esc(r.text)}<div class=\"list-item-sub\">${r.time}</div></div>\n      <button class=\"delete-btn\" onclick=\"delQiqi(${i})\">\u00d7</button>\n    </div>\n  `).join('');\n}\nfunction addQiqi(){\n  const inp=$('qiqiInput');const v=inp.value.trim();if(!v)return;\n  const records=LS.get('qiqi',[]);\n  records.unshift({text:v,time:new Date().toLocaleString('zh-CN')});\n  LS.set('qiqi',records);inp.value='';renderQiqi();\n}\nfunction delQiqi(i){const a=LS.get('qiqi',[]);a.splice(i,1);LS.set('qiqi',a);renderQiqi()}\n$('qiqiInput').addEventListener('keydown',e=>{if(e.key==='Enter')addQiqi()});\n\n// --- Calendar ---\nfunction renderCalendar(){\n  const now=new Date();\n  const year=now.getFullYear(),month=now.getMonth();\n  const firstDay=new Date(year,month,1).getDay();\n  const daysInMonth=new Date(year,month+1,0).getDate();\n  const todayDate=now.getDate();\n  const exerciseData=LS.get('exercise_'+year+'_'+month,{});\n  const exerciseIcons={'\u6838\u5fc3\u8bad\u7ec3':'\ud83d\udcaa','\u4f53\u6001\u8bad\u7ec3':'\ud83e\uddd8','\u5927\u6b65\u8d70':'\ud83d\udeb6','\u9a91\u8f66':'\ud83d\udeb4','\u547c\u5566\u5708':'\u2b55','\u4f11\u606f\u65e5':'\ud83d\ude34'};\n  const headers=['\u65e5','\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d'];\n  let html='<div class=\"calendar-grid\">';\n  headers.forEach(h=>html+=`<div class=\"cal-header\">${h}</div>`);\n  for(let i=0;i<firstDay;i++)html+='<div class=\"cal-day empty\"></div>';\n  for(let d=1;d<=daysInMonth;d++){\n    const key=d+'';\n    const ex=exerciseData[key];\n    const isToday=d===todayDate;\n    let cls='cal-day';\n    if(isToday)cls+=' today';\n    if(ex)cls+=' checked';\n    const icon=ex?exerciseIcons[ex]||'':'';\n    html+=`<div class=\"${cls}\" onclick=\"pickExercise(${d})\">\n      <span>${d}</span>\n      ${ex?`<span class=\"check-mark\">\u2713</span><span class=\"exercise-icon\">${icon}</span>`:''}\n    </div>`;\n  }\n  html+='</div>';\n  $('calendarContainer').innerHTML=html;\n  const totalDays=Object.keys(exerciseData).length;\n  const restDays=Object.values(exerciseData).filter(v=>v==='\u4f11\u606f\u65e5').length;\n  $('calStats').textContent=`\u672c\u6708\u8fd0\u52a8 ${totalDays-restDays} \u5929 / \u5171 ${daysInMonth} \u5929`;\n}\n\nfunction pickExercise(day){\n  const now=new Date();\n  const year=now.getFullYear(),month=now.getMonth();\n  const key='exercise_'+year+'_'+month;\n  const data=LS.get(key,{});\n  const types=['\u6838\u5fc3\u8bad\u7ec3','\u4f53\u6001\u8bad\u7ec3','\u5927\u6b65\u8d70','\u9a91\u8f66','\u547c\u5566\u5708','\u4f11\u606f\u65e5'];\n  const current=data[day+''];\n  const idx=current?types.indexOf(current):-1;\n  const next=types[(idx+1)%types.length];\n  if(current&&idx===types.length-1){delete data[day+'']}\n  else{data[day+'']=next}\n  LS.set(key,data);renderCalendar();\n}\n\n// --- Diet ---\nfunction renderDiet(){\n  const d=today();\n  const dietData=LS.get('diet_'+d,{meals:[{type:'\u65e9\u9910',items:[]},{type:'\u5348\u9910',items:[]},{type:'\u665a\u9910',items:[]},{type:'\u52a0\u9910',items:[]}]});\n  const mealEmojis={'\u65e9\u9910':'\ud83c\udf05','\u5348\u9910':'\u2600\ufe0f','\u665a\u9910':'\ud83c\udf19','\u52a0\u9910':'\ud83c\udf4e'};\n  let html='';\n  dietData.meals.forEach((meal,mi)=>{\n    html+=`<div class=\"meal-section\">\n      <div class=\"meal-label\">${mealEmojis[meal.type]||''} ${meal.type}</div>`;\n    meal.items.forEach((item,ii)=>{\n      html+=`<div class=\"meal-item\">\n        <span class=\"meal-item-text\">${esc(item)}</span>\n        <button class=\"delete-btn\" onclick=\"delDietItem(${mi},${ii})\">\u00d7</button>\n      </div>`;\n    });\n    html+=`<div class=\"input-row\" style=\"margin-top:4px\">\n      <input class=\"input-field\" id=\"dietInput_${mi}\" placeholder=\"\u6dfb\u52a0\u98df\u7269...\" style=\"font-size:13px\">\n      <button class=\"btn btn-primary btn-sm\" onclick=\"addDietItem(${mi})\">+</button>\n    </div></div>`;\n  });\n  $('dietCard').innerHTML=html;\n  dietData.meals.forEach((_,mi)=>{\n    const inp=$('dietInput_'+mi);\n    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')addDietItem(mi)});\n  });\n}\nfunction addDietItem(mi){\n  const inp=$('dietInput_'+mi);const v=inp.value.trim();if(!v)return;\n  const d=today();\n  const data=LS.get('diet_'+d,{meals:[{type:'\u65e9\u9910',items:[]},{type:'\u5348\u9910',items:[]},{type:'\u665a\u9910',items:[]},{type:'\u52a0\u9910',items:[]}]});\n  data.meals[mi].items.push(v);\n  LS.set('diet_'+d,data);renderDiet();\n}\nfunction delDietItem(mi,ii){\n  const d=today();\n  const data=LS.get('diet_'+d,{meals:[]});\n  data.meals[mi].items.splice(ii,1);\n  LS.set('diet_'+d,data);renderDiet();\n}\n\n// ======================== HELPERS ========================\nfunction esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}\n</script>\n</body>\n</html>\n";
