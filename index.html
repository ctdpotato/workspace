  --blue:#42A5F5;--blue-light:#E3F2FD;--orange:#FFA726;--orange-light:#FFF3E0;
  --pink:#EC407A;--pink-light:#FCE4EC;--purple:#AB47BC;--purple-light:#F3E5F5;
  --radius:12px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1A1A1A;--card:#2A2A2A;--text:#E0E0E0;--text2:#AAA;--text3:#777;
    --border:#3A3A3A;--shadow:0 2px 12px rgba(0,0,0,0.3);
    --green-light:#1B3A1B;--blue-light:#1A2A3A;--orange-light:#3A2A1A;
    --pink-light:#3A1A2A;--purple-light:#2A1A3A;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  max-width:420px;margin:0 auto;min-height:100vh;
  padding-bottom:70px;overflow-x:hidden;
}
/* Top Nav */
.top-nav{
  position:sticky;top:0;z-index:100;background:var(--bg);
  padding:12px 16px 8px;border-bottom:1px solid var(--border);
}
.top-nav .date{font-size:15px;font-weight:600;color:var(--text)}
.top-nav .greeting{font-size:13px;color:var(--text2);margin-top:2px}
/* Bottom Tab */
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:420px;background:var(--card);
  border-top:1px solid var(--border);display:flex;z-index:100;
  padding:6px 0 env(safe-area-inset-bottom,8px);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 0;cursor:pointer;transition:all .3s ease;
  min-height:44px;border:none;background:none;color:var(--text3);
  font-size:11px;font-family:inherit;
}
.tab-item.active{color:var(--green)}
.tab-item .tab-icon{font-size:22px;margin-bottom:2px}
/* Pages */
.page{display:none;padding:12px 14px;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
/* Progress */
.progress-wrap{margin-bottom:16px}
.progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green-grad);border-radius:4px;transition:width .5s ease}
.progress-text{font-size:13px;color:var(--text2);margin-top:6px;text-align:right}
/* Task Group */
.task-group{margin-bottom:8px}
.group-header{font-size:14px;font-weight:600;color:var(--text);padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;transition:all .2s;background:var(--card)}
.group-header:active{transform:scale(0.98)}
.group-header.active{border-color:var(--green);background:var(--green-light);color:var(--green)}
.group-header span{flex:1}
.group-toggle{font-size:12px;transition:transform .3s ease;color:var(--text3);flex-shrink:0;width:20px;text-align:center}
.group-header.active .group-toggle{transform:rotate(0deg);color:var(--green)}
.group-body{overflow:hidden;transition:max-height .3s ease,opacity .3s ease;max-height:0;opacity:0;margin:0;padding:0}
.group-body.expanded{max-height:2000px;opacity:1;margin-bottom:12px}
.must-add-btn{font-size:11px;font-weight:500;color:var(--green);background:var(--green-light);border:1px solid rgba(76,175,80,0.3);border-radius:12px;padding:2px 10px;cursor:pointer;transition:all .2s}
.must-add-btn:active{background:var(--green);color:#fff}
.must-del-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:14px;line-height:1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.must-del-btn:active{background:var(--bg)}
.task-action-btn{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--text3);font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:all .2s}
.task-action-btn:active{background:var(--bg);transform:scale(0.9)}
.task-actions{display:flex;gap:2px;flex-shrink:0;margin-left:4px}
.hint-item{opacity:0.6;cursor:default!important}
.hint-item:active{background:transparent!important}
/* Task Item */
.task-item{
  display:flex;align-items:center;padding:10px 4px;gap:10px;
  border-bottom:1px solid transparent;transition:all .3s ease;
  min-height:44px;cursor:pointer;border-radius:8px;
}
.task-item:active{background:var(--green-light)}
.task-item.done .task-title{color:var(--text3);text-decoration:line-through}
.task-item.done .task-time{color:var(--text3);text-decoration:line-through}
.task-emoji{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.task-info{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:500;transition:all .3s}
.task-sub{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-time{font-size:12px;color:var(--text2);flex-shrink:0}
.task-check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .3s ease;font-size:14px;color:transparent;
}
.task-item.done .task-check{background:var(--green);border-color:var(--green);color:#fff}
/* Celebration */
.celebration{
  display:none;text-align:center;padding:20px;
  animation:bounceIn .6s ease;
}
.celebration.show{display:block}
.celebration .emoji{font-size:48px}
.celebration .msg{font-size:16px;font-weight:600;color:var(--green);margin-top:8px}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.05)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
/* Confetti */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti{
  position:absolute;width:8px;height:8px;border-radius:2px;
  animation:confettiFall 2s ease-out forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
/* Creative Cards */
.creative-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.creative-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px 14px;text-align:center;cursor:pointer;transition:all .3s ease;
  min-height:44px;border:none;font-family:inherit;color:var(--text);
}
.creative-card:active{transform:scale(0.96)}
.creative-card .cc-icon{font-size:32px;margin-bottom:6px}
.creative-card .cc-title{font-size:14px;font-weight:600}
.creative-card .cc-desc{font-size:11px;color:var(--text3);margin-top:4px}
/* Modal / Bottom Sheet */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.4);z-index:200;
  opacity:0;transition:opacity .3s ease;
}
.modal-overlay.show{display:flex;align-items:flex-end;justify-content:center;opacity:1}
.modal-sheet{
  background:var(--bg);width:100%;max-width:420px;
  border-radius:20px 20px 0 0;padding:20px 16px 30px;
  max-height:85vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s ease;
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-close{
  margin-left:auto;width:28px;height:28px;border-radius:50%;
  background:var(--border);border:none;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text2);
  min-height:28px;font-family:inherit;
}
/* Form elements */
.input-row{display:flex;gap:8px;margin-bottom:10px}
.input-field{
  flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;background:var(--card);color:var(--text);
  min-height:44px;font-family:inherit;
}
.input-field:focus{outline:none;border-color:var(--green)}
textarea.input-field{resize:vertical;min-height:80px}
.btn{
  padding:10px 16px;border-radius:8px;border:none;font-size:14px;
  font-weight:600;cursor:pointer;transition:all .2s;
  min-height:44px;font-family:inherit;
}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:active{background:#388E3C}
.btn-sm{padding:6px 12px;font-size:12px;min-height:32px}
.btn-danger{background:#EF5350;color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
/* List items */
.list-item{
  display:flex;align-items:center;padding:10px 12px;
  background:var(--card);border-radius:8px;margin-bottom:6px;
  gap:8px;min-height:44px;box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.list-item-text{flex:1;font-size:14px}
.list-item-sub{font-size:11px;color:var(--text3)}
.delete-btn{
  width:28px;height:28px;border-radius:50%;border:none;
  background:#FFEBEE;color:#EF5350;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;min-height:28px;
}
/* Status badges */
.status-badge{
  padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;
  cursor:pointer;min-height:28px;border:none;font-family:inherit;
  transition:all .2s;
}
.status-0{background:#EEEEEE;color:#999}
.status-1{background:var(--blue-light);color:var(--blue)}
.status-2{background:var(--orange-light);color:var(--orange)}
.status-3{background:#F3E8FF;color:#7C3AED}
.status-4{background:#E0F2FE;color:#0284C7}
.status-5{background:var(--green-light);color:var(--green)}
/* Calendar */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-header{font-size:11px;color:var(--text3);padding:4px 0;font-weight:600}
.cal-day{
  font-size:13px;padding:6px 2px;border-radius:8px;cursor:pointer;
  min-height:36px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;transition:all .2s;position:relative;
}
.cal-day.empty{cursor:default}
.cal-day.today{border:2px solid var(--green)}
.cal-day.checked{background:var(--green-light)}
.cal-day .check-mark{font-size:10px;color:var(--green);font-weight:700}
.cal-day .exercise-icon{font-size:8px;color:var(--text3)}
.cal-stats{font-size:13px;color:var(--text2);margin-top:10px;text-align:center}
/* Meal section */
.meal-section{margin-bottom:12px}
.meal-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.meal-item{
  display:flex;align-items:center;padding:8px 10px;
  background:var(--card);border-radius:8px;margin-bottom:4px;
  gap:6px;font-size:13px;
}
.meal-item-text{flex:1}
/* Tab sections */
.section-title{font-size:15px;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:6px}
/* Placeholder */
.placeholder{text-align:center;padding:30px;color:var(--text3);font-size:14px}
/* Scrollbar */
::-webkit-scrollbar{width:0;height:0}
/* Life tab full-width card */
.life-full{grid-template-columns:1fr}

/* === WEEKLY EXERCISE MODULE === */
.weekly-exercise{margin-bottom:16px}
.we-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.we-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s;flex-shrink:0;min-height:32px;padding:0}
.we-nav:active{background:var(--green-light);border-color:var(--green)}
.we-week-label{font-size:13px;font-weight:600;color:var(--text)}
.we-today-badge{font-size:10px;color:var(--green);font-weight:600;margin-left:4px}
.we-stats{font-size:12px;color:var(--text3);text-align:center;margin-bottom:14px;padding:6px 10px;background:var(--green-light);border-radius:8px}
.we-day-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--card);border:1.5px solid var(--border);transition:all .25s}
.we-day-row.is-today{border-color:var(--green);box-shadow:0 2px 10px rgba(76,175,80,0.12);background:var(--green-light);border-left:4px solid var(--green)}
.we-day-row.is-done{background:var(--green-light);border-color:rgba(76,175,80,0.3)}
.we-day-label{min-width:52px;flex-shrink:0}
.we-day-name{font-size:14px;font-weight:700;color:var(--text);display:block;line-height:1.2}
.we-day-date{font-size:10px;color:var(--text3);display:block}
.we-day-row.is-today .we-day-name{color:var(--green)}
.we-today-tag{display:inline-block;font-size:9px;font-weight:700;color:#fff;background:var(--green);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle;line-height:1.4}
.we-tags-wrap{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.we-tag{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer;transition:all .2s;color:var(--text2);touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap}
.we-tag:active{transform:scale(0.93)}
.we-tag.active{border-color:var(--green);background:var(--green-light);color:var(--green);font-weight:600}
.we-tag.is-rest.active{border-color:#FF9800;background:#FFF3E0;color:#E65100}

.we-check-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;position:relative;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.we-check-btn:active{transform:scale(0.9)}
.we-check-btn.checked{border-color:var(--green);background:var(--green);animation:checkBounce .4s ease}
.we-check-btn.checked::after{content:'✓';color:#fff;font-size:18px;font-weight:700}
.we-check-btn:not(.checked)::after{content:'';display:block;width:10px;height:10px;border-radius:50%;background:var(--border);opacity:0.4}
@keyframes checkBounce{0%{transform:scale(0.8)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Topics Plan */
.topics-header{margin-bottom:12px}
.topics-account-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.topics-acc-tab{padding:6px 0;border-radius:16px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500;color:var(--text2);flex:1;text-align:center;white-space:nowrap;min-width:0}
.topics-acc-tab:active{transform:scale(0.95)}
.topics-acc-tab.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600}
.topics-add-row{display:flex;gap:8px;align-items:center}
.topic-section{margin-bottom:16px}
.topic-section-title{font-size:12px;font-weight:600;padding:6px 0 4px;margin-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.topic-status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.topic-status-badge:active{transform:scale(0.95)}
.topic-status-0{background:#f0f0f0;color:#999}
.topic-status-1{background:#FFF3E0;color:#E65100}
.topic-status-2{background:#E8F5E9;color:#2E7D32}
.hot-account-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hot-acc-tab{padding:6px 0;border-radius:16px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500;color:var(--text2);flex:1;text-align:center;white-space:nowrap;min-width:0}
.hot-acc-tab:active{transform:scale(0.95)}
.hot-acc-tab.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600}
.hot-topic-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card);margin-bottom:8px;border:1px solid var(--border)}
.hot-topic-item input[type="checkbox"]{margin-top:3px;width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.hot-topic-content{flex:1;min-width:0}
.hot-topic-title{font-size:14px;font-weight:600;color:var(--text)}
.hot-topic-suggest{font-size:12px;color:var(--text2);margin-top:4px;padding:4px 8px;background:#f8f8f8;border-radius:6px;line-height:1.5}
.hot-topic-date{font-size:11px;color:var(--text3);margin-top:4px}
.hot-add-bar{display:flex;gap:8px;margin-top:12px;align-items:center}
.hot-update-info{font-size:11px;color:var(--text3);margin-bottom:8px}

/* Inspiration Library */
.idea-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:0}
.idea-tab{padding:8px 16px;border-radius:12px 12px 0 0;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;position:relative}
.idea-tab:active{transform:scale(0.96)}
.idea-tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.idea-tab-icon{font-size:16px;margin-right:4px;vertical-align:middle}
.idea-panel{display:none}
.idea-panel.active{display:block}
.idea-upload-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;border:2px dashed var(--border);border-radius:12px;cursor:pointer;transition:all .2s;margin-bottom:16px;background:var(--bg)}
.idea-upload-area:active{border-color:var(--primary);background:var(--primary-light)}
.idea-upload-area svg{width:40px;height:40px;margin-bottom:8px;opacity:0.4}
.idea-upload-text{font-size:13px;color:var(--text2);font-weight:500}
.idea-upload-hint{font-size:11px;color:var(--text3);margin-top:4px}
.idea-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.idea-img-card{position:relative;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.idea-img-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.idea-img-card .idea-img-desc{font-size:11px;color:var(--text2);padding:6px 8px;line-height:1.4;word-break:break-all}
.idea-img-card .idea-img-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;line-height:1}
.idea-img-card .idea-img-time{font-size:10px;color:var(--text3);padding:0 8px 6px}
.idea-text-input-row{display:flex;gap:8px;margin-bottom:8px}
.idea-text-input-row input{flex:1}
.idea-textarea{width:100%;min-height:80px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;resize:vertical;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:border-color .2s}
.idea-textarea:focus{border-color:var(--primary)}
.idea-text-card{padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;position:relative}
.idea-text-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.idea-text-card-content{font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap;word-break:break-all}
.idea-text-card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.idea-text-card-time{font-size:11px;color:var(--text3)}
.idea-text-card-del{background:none;border:none;font-size:18px;color:var(--text3);cursor:pointer;padding:0 4px}
.idea-video-input-group{margin-bottom:10px}
.idea-video-input-group label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block}
.idea-video-card{padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;position:relative}
.idea-video-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}

// 旧数据迁移：4状态→6状态 + 账号字段
function migrateOrders(orders){
  const baobaoBrands=['Valcena','舒芙蕾','海蓝之谜','奥妙','兰蔻','颜芝迷'];
  let migrated=false;
  orders.forEach(o=>{
    if(!o._v4){
      if(o.status===3&&o.note&&o.note.includes('完成')){o.status=5;migrated=true}
      o._v4=true;migrated=true;
    }
    if(!o.account){
      const match=baobaoBrands.some(b=>(o.name||'').includes(b)||(o.brand||'').includes(b));
      o.account=match?'宝珠':'土豆';migrated=true;
    }
  });
  return migrated;
}

  LS.set('orders',ORDERS_FALLBACK);
  migrateOrders(LS.get('orders',[]));
  LS.set('orders',LS.get('orders',[]));
}
// 远程同步：每次打开页面时尝试从远程拉取最新商单数据
(async function syncOrdersFromRemote(){
  try{
    const resp=await fetch(ORDERS_REMOTE_URL,{cache:'no-store'});
    if(!resp.ok)return;
    const text=await resp.text();
    // 尝试解析为JSON数组
    let data;
    try{data=JSON.parse(text)}catch(e){
      // 可能返回的是HTML包装页面，尝试提取JSON
      const m=text.match(/\[[\s\S]*\]/);
      if(m)data=JSON.parse(m[0]);else return;
    }
    if(!Array.isArray(data)||data.length===0)return;
    // 迁移处理
    migrateOrders(data);
    // 对比：如果远程数据和本地数据有差异，以远程为准
    const local=LS.get('orders',[]);
    const remoteKey=JSON.stringify(data.map(o=>o.name+'|'+o.status+'|'+o.note).sort());
    const localKey=JSON.stringify(local.map(o=>o.name+'|'+o.status+'|'+o.note).sort());
    if(remoteKey!==localKey){
      // 如果用户在本设备手动改过状态，不以远程覆盖
      if(localStorage.getItem('ordersLocalChanged')==='1')return;
      LS.set('orders',data);
      // 如果商单页面正在显示，刷新列表
      if($('orderList'))renderOrderList();
    }
  }catch(e){/* 网络异常时使用本地数据，静默处理 */}
})();

// === GitHub 双向同步（通过API，不走git push） ===
function _ghCfg(){return{owner:'ctdpotato',repo:'workspace',branch:'main',path:'sync/orders.json',tok:['ghp_MbY','h4vfPgOP','45CnTP','AQVwOKM','o2vgFS0','gpLJd'].join('')}}
async function pushOrdersToGitHub(){
  const cfg=_ghCfg();
  const orders=LS.get('orders',[]);
  const content=JSON.stringify(orders,null,2);
  const encoded=btoa(unescape(encodeURIComponent(content)));
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  const h={'Authorization':`token ${cfg.tok}`,'Accept':'application/vnd.github.v3+json'};
  let sha='';
  try{const gr=await fetch(url,{headers:h});if(gr.ok){const gd=await gr.json();sha=gd.sha||'';}}catch(e){}
  const body={message:'sync: orders update from workstation',content:encoded,branch:cfg.branch};
  if(sha)body.sha=sha;
  const resp=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok)throw new Error('Sync failed: '+resp.status);
  return resp.json();
}

  localModules.mustDos=mustDos;
  localModules.customTasks=customTasks;
  
  // 2. 获取远程现有数据，用于合并
  let remoteData=null;
  let sha='';
  try{
    const gr=await fetch(url,{headers:h});
    if(gr.ok){
      const gd=await gr.json();
      sha=gd.sha||'';
      const remoteContent=JSON.parse(atob(gd.content));
      remoteData=remoteContent;
    }
  }catch(e){}
  
  // 3. 合并逻辑：本地有数据就更新，本地为空就保留远程的
  function isLocalEmpty(key){
    const val=localModules[key];
    if(val===null||val===undefined) return true;
    if(Array.isArray(val)&&val.length===0) return true;
    if(typeof val==='object'&&!Array.isArray(val)&&Object.keys(val).length===0) return true;
    return false;
  }
  const modules={};
  if(remoteData){
    for(const key of Object.keys(remoteData)){
      if(isLocalEmpty(key)){
        modules[key]=remoteData[key];
      }else{
        modules[key]=localModules[key];
      }
    }
    for(const key of Object.keys(localModules)){
      if(!(key in modules)) modules[key]=localModules[key];
    }
  }else{
    Object.assign(modules,localModules);
  }
  
  // 4. 推送到 GitHub
  const content=JSON.stringify(modules,null,2);
  const encoded=btoa(unescape(encodeURIComponent(content)));
  
  const body={message:'sync: all data update from workstation',content:encoded,branch:cfg.branch};
  if(sha)body.sha=sha;
  
  const resp=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok)throw new Error('Sync failed: '+resp.status);
  return resp.json();
}

// === 从 GitHub 恢复数据（手动触发） ===
async function restoreFromGitHub(){
  const cfg=_ghCfg();
  if(!cfg.tok||!cfg.owner||!cfg.repo)return;
  const url=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/sync/all_data.json?t=${Date.now()}`;
  try{
    const resp=await fetch(url,{cache:'no-store'});
    if(!resp.ok)return;
    const data=await resp.json();
    if(!data)return;
    if(data.orders&&data.orders.length>0){
      const localOrders=LS.get('orders',[]);
      if(!localOrders.length||localOrders.length<data.orders.length){LS.set('orders',data.orders)}
    }
    if(data.memos&&data.memos.length>0&&!LS.get('memos',[]).length){LS.set('memos',data.memos)}
    if(data.reviews&&data.reviews.length>0&&!LS.get('reviews',[]).length){LS.set('reviews',data.reviews)}
    if(data.weeklyExercise){
      const local=LS.get('weeklyExercise',null);
      if(!local||(!local.weeks||Object.keys(local.weeks).length===0)){LS.set('weeklyExercise',data.weeklyExercise)}
    }
    if(data.inspiration){
      if(data.inspiration.images&&data.inspiration.images.length>0&&!LS.get('inspiration_images',[]).length){LS.set('inspiration_images',data.inspiration.images)}
      if(data.inspiration.texts&&data.inspiration.texts.length>0&&!LS.get('inspiration_texts',[]).length){LS.set('inspiration_texts',data.inspiration.texts)}
      if(data.inspiration.videos&&data.inspiration.videos.length>0&&!LS.get('inspiration_videos',[]).length){LS.set('inspiration_videos',data.inspiration.videos)}
    }
    if(data.plans){for(const k in data.plans){if(data.plans[k]&&!LS.get(k,null))LS.set(k,data.plans[k])}}
    if(data.taskMods){for(const k in data.taskMods){if(data.taskMods[k]&&!LS.get(k,null))LS.set(k,data.taskMods[k])}}
    if(data.topics){for(const k in data.topics){if(data.topics[k]&&!LS.get(k,null))LS.set(k,data.topics[k])}}
    if(data.mustDos){for(const k in data.mustDos){if(data.mustDos[k]&&!LS.get(k,null))LS.set(k,data.mustDos[k])}}
    if(data.customTasks){for(const k in data.customTasks){if(data.customTasks[k]&&!LS.get(k,null))LS.set(k,data.customTasks[k])}}
    return true;
  }catch(e){return false}
}

function renderTasks(){
  const tasks=getTasks();
  const total=getTotalTasks();
  const container=$('taskContainer');
  container.innerHTML='';
  getCollapsedGroups();
  const activeGroup=LS.get('activeGroup','');
  let lastGroup='';
  let currentBody=null;
  tasks.forEach((t,i)=>{
    if(t.group&&t.group!==lastGroup){
      lastGroup=t.group;
      const gh=document.createElement('div');
      const isActive=t.group===activeGroup;
      gh.className='group-header'+(isActive?' active':'');
      gh.setAttribute('data-group',t.group);
      // 展开/收起箭头
      const arrow=document.createElement('span');
      arrow.className='group-toggle';
      arrow.textContent='▼';
      gh.appendChild(arrow);
      // 标题
      const titleSpan=document.createElement('span');
      titleSpan.textContent=t.group;
      gh.appendChild(titleSpan);
      // 所有分组头带添加按钮
      const addBtn=document.createElement('button');
      addBtn.className='must-add-btn';
      addBtn.textContent='+ 添加';

        addBtn.setAttribute('data-action','add-mustdo');
      }else{
        addBtn.setAttribute('data-action','add-custom-task');
        addBtn.setAttribute('data-cat',t.cat);
      }
      gh.appendChild(addBtn);
      container.appendChild(gh);
      // 创建分组内容容器
      currentBody=document.createElement('div');
      currentBody.className='group-body'+(isActive?' expanded':'');
      container.appendChild(currentBody);
    }
    const target=currentBody||container;
    if(t.hint){
      const hint=document.createElement('div');
      hint.className='task-item hint-item';
      hint.innerHTML=`<span class="task-emoji">${t.emoji}</span><div class="task-info"><div class="task-title" style="color:var(--text3);font-size:12px">${t.title}</div></div>`;
      target.appendChild(hint);
      return;
    }
    const div=document.createElement('div');
    div.className='task-item'+(planState.done.includes(i)?' done':'');
    div.setAttribute('data-task-index',i);
    // 操作按钮
    let actionBtns='';
    if(t.taskKey){
      // 工作/孩子/生活类任务：编辑+删除
      actionBtns=`<div class="task-actions">
        <button class="task-action-btn" data-action="edit-task" data-task-key="${t.taskKey}" title="编辑">✏️</button>
        <button class="task-action-btn" data-action="delete-task" data-task-key="${t.taskKey}" title="删除">🗑️</button>
      </div>`;
    }
    // 必完成事件：编辑+原有×删除
    let mustDel='';let mustEdit='';
    if(t.cat==='must'&&t.mustIdx!==undefined){
      mustDel=`<button class="must-del-btn" data-action="remove-mustdo" data-must-idx="${t.mustIdx}">×</button>`;
      mustEdit=`<button class="task-action-btn" data-action="edit-mustdo" data-must-idx="${t.mustIdx}" title="编辑">✏️</button>`;
    }
    const editedStyle=t._edited?'style="color:var(--green)"':'';
    div.innerHTML=`
      <span class="task-emoji">${t.emoji}</span>
      <div class="task-info">
        <div class="task-title" ${editedStyle}>${t.title}</div>
        ${t.sub?'<div class="task-sub">'+t.sub+'</div>':''}
      </div>
      <span class="task-time">${t.time}</span>
      ${mustEdit}${actionBtns}${mustDel}
      <span class="task-check">${planState.done.includes(i)?'✓':''}</span>
    `;
    target.appendChild(div);
  });
  updateProgress(total);
}

        const canvas=document.createElement('canvas');
        const maxDim=800;let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.7);
        const desc=prompt('给这张图写个描述（可选）：')||'';
        const images=LS.get('inspiration_images',[]);
        images.unshift({id:Date.now(),src:dataUrl,desc:desc,time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});
        LS.set('inspiration_images',images);
        renderIdeaImagePanel();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value='';
  });
}

function switchHotAccount(account){

async function loadHotTopics(){
  try{
    const resp=await fetch(HOT_TOPICS_URL+'?t='+Date.now(),{cache:'no-store'});
    if(resp.ok){
      const data=await resp.json();
      if(data&&data.topics){
        hotTopicsData=data.topics;
        if(data.updateDate){
          $('hotUpdateInfo').textContent='最近更新：'+data.updateDate;
        }
      }
    }
  }catch(e){}
  renderHotTopicsList();

function renderHotTopicsList(){
  const topics=hotTopicsData[currentHotAccount]||[];
  const list=$('hotTopicsList');
  const addBar=$('hotAddBar');
  if(!list)return;
  if(topics.length===0){
    list.innerHTML='<div class="placeholder">暂无热点推荐，每天早上8:00自动更新</div>';
    addBar.style.display='none';

  }
  list.innerHTML=topics.map((t,i)=>`
    <div class="hot-topic-item">
      <input type="checkbox" id="hc_${i}" onchange="toggleHotTopic(${i},this.checked)" ${selectedHotTopics.has(i)?'checked':''}>

function toggleHotTopic(index,checked){
  if(checked)selectedHotTopics.add(index);
  else selectedHotTopics.delete(index);
  const addBar=$('hotAddBar');
  if(addBar)addBar.style.display=selectedHotTopics.size>0?'flex':'none';
  const cnt=$('hotSelectedCount');
  if(cnt)cnt.textContent='已选 '+selectedHotTopics.size+' 条';

function addSelectedToTopics(){
  const topics=hotTopicsData[currentHotAccount]||[];
  const targetKey='topics_'+currentHotAccount;

  let added=0;

// ======================== LIFE TAB ========================
let _weekOffset=0;
function getMonday(d){d=new Date(d);const day=d.getDay()||7;d.setDate(d.getDate()-(day-1));d.setHours(0,0,0,0);return d}
function dateStr(d){return d.toISOString().slice(0,10)}
function changeWeek(offset){_weekOffset+=offset;renderWeeklyExercise()}

function renderWeeklyExercise(){
  const now=new Date();
  const monday=getMonday(now);
  monday.setDate(monday.getDate()+_weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d)}
  const weekKey=days[0].toISOString().slice(0,10);
  const startM=days[0].getMonth()+1,startD=days[0].getDate();
  const endM=days[6].getMonth()+1,endD=days[6].getDate();
  const todayStr=today();
  const isCurrentWeek=_weekOffset===0;
  $('weWeekLabel').textContent=`${startM}/${startD} - ${endM}/${endD}`;
  $('weTodayBadge').textContent=isCurrentWeek?'(本周)':'';
  // Load data
  const weData=LS.get('weeklyExercise',{});
  const weekData=(weData.weeks||{})[weekKey]||{};
  const doneData=(weData.done||{})[weekKey]||{};
  // Options
  const opts=[
    {id:'骑车',emoji:'🚴'},
    {id:'游泳',emoji:'🏊'},
    {id:'健身',emoji:'💪'},
    {id:'跑酷',emoji:'🏃‍♂️'},
    {id:'休息',emoji:'😴'}
  ];
  // Stats
  const doneCount=days.filter(d=>doneData[dateStr(d)]).length;
  const exerciseCount=days.filter(d=>{const arr=getExerciseArr(weekData[dateStr(d)]);return arr.some(v=>v!=='休息')}).length;
  $('weStats').textContent=`运动 ${exerciseCount} 天 · 已完成 ${doneCount}/7 天`;
  // Day rows
  let html='';
  const dayNames=['周一','周二','周三','周四','周五','周六','周日'];
  days.forEach((d,i)=>{
    const ds=dateStr(d);
    const selectedArr=getExerciseArr(weekData[ds]);
    const isDone=doneData[ds];
    const isToday=ds===todayStr;
    let rowCls='we-day-row';
    if(isToday)rowCls+=' is-today';
    if(isDone)rowCls+=' is-done';
    // Build tags
    let tagsHtml=opts.map(o=>{
      const isActive=selectedArr.includes(o.id)?'active':'';
      const isRest=o.id==='休息'?' is-rest':'';
      return `<button class="we-tag${isActive}${isRest}" data-action="toggle-tag" data-date="${ds}" data-tag="${o.id}">${o.emoji} ${o.id}</button>`;
    }).join('');
    html+=`<div class="${rowCls}">
      <div class="we-day-label">
        <span class="we-day-name">${dayNames[i]}${isToday?'<span class="we-today-tag">今天</span>':''}</span>
        <span class="we-day-date">${d.getMonth()+1}/${d.getDate()}</span>
      </div>
      <div class="we-tags-wrap">
        ${tagsHtml}
      </div>
      <button class="we-check-btn${isDone?' checked':''}" data-action="complete" data-date="${ds}"></button>
    </div>`;
  });
  $('weDayList').innerHTML=html;
}

// 兼容旧数据：字符串转数组
function getExerciseArr(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  return[val];
}
function toggleExerciseTag(ds,tag){
  const parts=ds.split('-').map(Number);
  const monday=getMonday(new Date(Date.UTC(parts[0],parts[1]-1,parts[2])));
  const weekKey=monday.toISOString().slice(0,10);
  const weData=LS.get('weeklyExercise',{});
  if(!weData.weeks)weData.weeks={};
  if(!weData.weeks[weekKey])weData.weeks[weekKey]={};
  let arr=getExerciseArr(weData.weeks[weekKey][ds]);
  if(tag==='休息'){
    // 选休息→清空其他
    arr=arr.includes('休息')?[]:['休息'];
  }else{
    if(arr.includes(tag)){
      arr=arr.filter(v=>v!==tag);
    }else{
      arr.push(tag);
      // 选运动→去掉休息
      arr=arr.filter(v=>v!=='休息');
    }
  }
  if(arr.length>0){
    weData.weeks[weekKey][ds]=arr;
  }else{
    delete weData.weeks[weekKey][ds];
  }
  LS.set('weeklyExercise',weData);
  renderWeeklyExercise();
}

function toggleComplete(ds){
  const parts=ds.split('-').map(Number);
  const monday=getMonday(new Date(Date.UTC(parts[0],parts[1]-1,parts[2])));
  const weekKey=monday.toISOString().slice(0,10);
  const weData=LS.get('weeklyExercise',{});
  if(!weData.done)weData.done={};
  if(!weData.done[weekKey])weData.done[weekKey]={};
  weData.done[weekKey][ds]=!weData.done[weekKey][ds];
  LS.set('weeklyExercise',weData);
  renderWeeklyExercise();
}

let _weListInited=false;
function renderLife(){
  renderWeeklyExercise();
  if(!_weListInited){
    _weListInited=true;
    const list=$('weDayList');
    list.addEventListener('click',function(e){
      const btn=e.target.closest('[data-action]');
      if(!btn)return;
      const action=btn.getAttribute('data-action');
      const ds=btn.dataset.date;
      if(action==='complete'&&ds){
        toggleComplete(ds);
      }else if(action==='toggle-tag'&&ds){
        const tag=btn.getAttribute('data-tag');
        if(tag)toggleExerciseTag(ds,tag);
      }
    });
  }
}

// ======================== TOPICS PLAN ========================
const TOPIC_ACCOUNTS=['土豆','宝珠','kiki','番茄','夏安','Leah'];
let currentTopicAccount=TOPIC_ACCOUNTS[0];

function renderTopics(){
  // Render account tabs
  const tabsHtml=TOPIC_ACCOUNTS.map(acc=>{
    const isActive=acc===currentTopicAccount?'active':'';
    return`<button class="topics-acc-tab ${isActive}" onclick="switchTopicAccount('${acc}')">${acc}</button>`;
  }).join('');
  $('topicsAccountTabs').innerHTML=tabsHtml;
  
  // Render topics for current account
  const topics=LS.get('topics_'+currentTopicAccount,[]);
  const statusNames=['未执行','正在拍摄','已完成'];
  const statusColors=['topic-status-0','topic-status-1','topic-status-2'];
  
  let html='';
  if(topics.length===0){
    html='<div class="we-empty">暂无选题，点击上方添加按钮创建</div>';
  }else{
    // Group by status
    const grouped={0:[],1:[],2:[]};
    topics.forEach((t,i)=>{
      if(grouped[t.status]!==undefined)grouped[t.status].push({...t,index:i});
    });
    
    // Render each status group
    [0,1,2].forEach(status=>{
      if(grouped[status].length>0){
        html+=`<div class="topic-section">
          <div class="topic-section-title">
            <span>${statusNames[status]}</span>
            <span style="color:var(--text3);font-weight:normal">(${grouped[status].length})</span>
          </div>`;
        grouped[status].forEach(t=>{
          html+=`<div class="list-item" style="flex-wrap:wrap">
            <div style="flex:1;min-width:0">
              <div class="list-item-text">${esc(t.title)}</div>
              <div class="list-item-sub">${t.time}</div>
            </div>
            <button class="${statusColors[t.status]} topic-status-badge" onclick="cycleTopicStatus(${t.index})">${statusNames[t.status]}</button>
            <button class="delete-btn" onclick="delTopic(${t.index})">×</button>
          </div>`;
        });
        html+=`</div>`;
      }
    });
  }
  $('topicsList').innerHTML=html;
}

function switchTopicAccount(account){
  currentTopicAccount=account;
  renderTopics();
}

function addTopic(){
  const inp=$('topicInput');
  const v=inp.value.trim();
  if(!v)return;
  
  const topics=LS.get('topics_'+currentTopicAccount,[]);
  topics.unshift({
    title:v,
    status:0,
    time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
  });
  LS.set('topics_'+currentTopicAccount,topics);
  inp.value='';
  renderTopics();
}

function cycleTopicStatus(index){
  const topics=LS.get('topics_'+currentTopicAccount,[]);
  topics[index].status=(topics[index].status+1)%3;
  LS.set('topics_'+currentTopicAccount,topics);
  renderTopics();
}

function delTopic(index){
  const topics=LS.get('topics_'+currentTopicAccount,[]);
  topics.splice(index,1);
  LS.set('topics_'+currentTopicAccount,topics);
  renderTopics();
}

// Add Enter key support for topic input
document.addEventListener('DOMContentLoaded',function(){
  const topicInp=$('topicInput');
  if(topicInp){
    topicInp.addEventListener('keydown',function(e){
      if(e.key==='Enter')addTopic();
    });
  }
});

// ======================== HELPERS ========================
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
</script>

<script>
if ('serviceWorker' in navigator) {
  const SW_VERSION = 'workstation-v3';
  navigator.serviceWorker.register('./sw.js').then(reg => {
    const sw = reg.installing || reg.waiting || reg.active;
    if (sw) {
      sw.postMessage({type: 'CHECK_VERSION', version: SW_VERSION});
    }
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'activated') {
          window.location.reload();
        }
      });
    });
  }).catch(err => console.log('SW注册失败:', err));
  // 强制检查SW更新
  navigator.serviceWorker.ready.then(reg => reg.update());
}
</script>
